global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9080"]

  # Compose's DNS answers the service name with one A record per replica, so `--scale worker=N` needs no edits here.
  - job_name: worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9081
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
