server:
  port: ${API_PORT:8080}

spring:
  application:
    name: codearena-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:codearena}
    username: ${POSTGRES_USER:codearena}
    password: ${POSTGRES_PASSWORD:codearena}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  http:
    client:
      connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_READ_TIMEOUT:60s}
  ai:
    retry:
      max-attempts: 1
    model:
      chat: ${AI_CHAT_PROVIDER:ollama}
      embedding: none
      embedding.text: none
      embedding.multimodal: none
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    chat:
      observations:
        log-prompt: false
        log-completion: false
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:1.5b}
          temperature: ${AI_TEMPERATURE:0.2}
          num-predict: ${AI_MAX_TOKENS:400}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${AI_TEMPERATURE:0.2}
          max-tokens: ${AI_MAX_TOKENS:400}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:codearena}
    password: ${RABBITMQ_PASSWORD:codearena}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

codearena:
  http:
    max-body-bytes: ${HTTP_MAX_BODY_BYTES:262144}
    max-test-case-body-bytes: ${HTTP_MAX_TEST_CASE_BODY_BYTES:33554432}
  problems:
    max-test-data-bytes: ${PROBLEM_MAX_TEST_DATA_BYTES:67108864}
  rate-limit:
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    redis-timeout: ${RATE_LIMIT_REDIS_TIMEOUT:2s}
    submissions:
      capacity: ${RATE_LIMIT_SUBMISSIONS_PER_MINUTE:10}
      period: 1m
    login-per-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:30}
      period: 1m
    login-per-username:
      capacity: ${RATE_LIMIT_LOGIN_PER_USERNAME_PER_MINUTE:10}
      period: 1m
    register-per-ip:
      capacity: ${RATE_LIMIT_REGISTER_PER_IP_PER_HOUR:10}
      period: 1h
    tutor:
      capacity: ${RATE_LIMIT_TUTOR_PER_MINUTE:5}
      period: 1m
  tutor:
    level3-cooldown: ${TUTOR_LEVEL3_COOLDOWN:5m}
    daily-cap: ${TUTOR_DAILY_CAP:30}
    max-code-block-lines: ${TUTOR_MAX_CODE_BLOCK_LINES:10}
    max-source-chars: ${TUTOR_MAX_SOURCE_CHARS:12000}
    max-statement-chars: ${TUTOR_MAX_STATEMENT_CHARS:8000}
  leaderboard:
    default-limit: ${LEADERBOARD_DEFAULT_LIMIT:50}
    max-limit: ${LEADERBOARD_MAX_LIMIT:200}
    broadcast-interval: ${LEADERBOARD_BROADCAST_INTERVAL:1s}
  sweeper:
    enabled: ${SWEEPER_ENABLED:true}
    interval: ${SWEEPER_INTERVAL:30s}
    stuck-after: ${SWEEPER_STUCK_AFTER:2m}
    max-requeues: ${SWEEPER_MAX_REQUEUES:3}
    batch-size: ${SWEEPER_BATCH_SIZE:50}
  messaging:
    confirm-timeout: ${MESSAGING_CONFIRM_TIMEOUT:10s}
  metrics:
    queue-depth-interval: ${METRICS_QUEUE_DEPTH_INTERVAL:15s}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

logging:
  level:
    org.springframework.ai.retry: ERROR
