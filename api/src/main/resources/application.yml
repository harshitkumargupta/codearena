server:
  port: ${API_PORT:8080}

spring:
  application:
    name: codearena-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:codearena}
    username: ${POSTGRES_USER:codearena}
    password: ${POSTGRES_PASSWORD:codearena}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:codearena}
    password: ${RABBITMQ_PASSWORD:codearena}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

codearena:
  messaging:
    confirm-timeout: ${MESSAGING_CONFIRM_TIMEOUT:10s}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
