name: codearena

x-java-service: &java-service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-codearena}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-codearena}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    <<: *java-service
    build:
      context: .
      dockerfile: api/Dockerfile
    image: codearena/api:local
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *rabbitmq-env
      MANAGEMENT_PORT: "9080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random string of at least 32 bytes}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-2h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env (see .env.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env (see .env.example)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      RATE_LIMIT_TRUSTED_PROXIES: 172.29.80.200
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-60s}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-400}
      TUTOR_LEVEL3_COOLDOWN: ${TUTOR_LEVEL3_COOLDOWN:-5m}
      TUTOR_DAILY_CAP: ${TUTOR_DAILY_CAP:-30}
      RATE_LIMIT_SUBMISSIONS_PER_MINUTE: ${RATE_LIMIT_SUBMISSIONS_PER_MINUTE:-10}
      RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:-30}
      RATE_LIMIT_LOGIN_PER_USERNAME_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_USERNAME_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_IP_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_IP_PER_HOUR:-10}
      RATE_LIMIT_TUTOR_PER_MINUTE: ${RATE_LIMIT_TUTOR_PER_MINUTE:-5}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6

  worker:
    <<: *java-service
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: codearena/worker:local
    mem_limit: 640m
    depends_on:
      rabbitmq:
        condition: service_healthy
    group_add:
      - ${DOCKER_SOCKET_GID:?Set DOCKER_SOCKET_GID in .env to the group id that owns the Docker socket (see .env.example)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *rabbitmq-env
      MANAGEMENT_PORT: "9081"
      DOCKER_HOST: unix:///var/run/docker.sock
      JUDGE_JAVA_IMAGE: ${JUDGE_JAVA_IMAGE:-codearena/judge-java:latest}
      JUDGE_PYTHON_IMAGE: ${JUDGE_PYTHON_IMAGE:-codearena/judge-python:latest}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  frontend:
    build:
      context: ./frontend
    image: codearena/frontend:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.29.80.200
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  judge-java:
    profiles: ["judge-images"]
    build:
      context: ./judge-images
      dockerfile: java/Dockerfile
    image: ${JUDGE_JAVA_IMAGE:-codearena/judge-java:latest}
    command: ["true"]

  judge-python:
    profiles: ["judge-images"]
    build:
      context: ./judge-images
      dockerfile: python/Dockerfile
    image: ${JUDGE_PYTHON_IMAGE:-codearena/judge-python:latest}
    command: ["true"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.80.0/24
          ip_range: 172.29.80.0/25

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
