name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven, Testcontainers, sandbox)
    # Pinned rather than ubuntu-latest: the sandbox reads cgroup v2 memory.peak (kernel 5.19+).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_REQUIRE_DOCKER: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Docker and cgroup v2
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          uname -r
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs || { echo "cgroup v2 is required by the sandbox"; exit 1; }

      - name: Build judge images
        run: ./judge-images/build.sh

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
