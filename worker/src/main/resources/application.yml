server:
  port: ${WORKER_PORT:8081}

spring:
  application:
    name: codearena-worker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:codearena}
    password: ${RABBITMQ_PASSWORD:codearena}
    listener:
      type: simple
      simple:
        acknowledge-mode: manual
        prefetch: ${WORKER_PREFETCH:1}
        concurrency: ${WORKER_CONCURRENCY:1}
        max-concurrency: ${WORKER_CONCURRENCY:1}

codearena:
  sandbox:
    docker-host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    java-image: ${JUDGE_JAVA_IMAGE:codearena/judge-java:latest}
    python-image: ${JUDGE_PYTHON_IMAGE:codearena/judge-python:latest}
    nano-cpus: ${SANDBOX_NANO_CPUS:1000000000}
    pids-limit: ${SANDBOX_PIDS_LIMIT:64}
    tmpfs-size-mb: ${SANDBOX_TMPFS_SIZE_MB:16}
    output-limit-bytes: ${SANDBOX_OUTPUT_LIMIT_BYTES:1048576}
    kill-grace-ms: ${SANDBOX_KILL_GRACE_MS:1000}
    compile-time-limit-ms: ${SANDBOX_COMPILE_TIME_LIMIT_MS:10000}
    compile-memory-mb: ${SANDBOX_COMPILE_MEMORY_MB:512}
    java-overhead-mb: ${SANDBOX_JAVA_OVERHEAD_MB:64}
    max-compiled-bytes: ${SANDBOX_MAX_COMPILED_BYTES:8388608}
  queues:
    jobs: ${JUDGE_JOBS_QUEUE:judge.jobs}
    results: ${JUDGE_RESULTS_QUEUE:judge.results}
    dead-letter: ${JUDGE_DLQ:judge.jobs.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
